<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Urtador</title>
</head>
  <body>
    <script>
      (function () {
        const suffix = window.location.pathname.replace(/^\/+/, "");
        window.location.replace(`/urtador/${suffix}${window.location.search}${window.location.hash}`);
      })();
    </script>
    <p><a href="/urtador/">Abrir o Urtador</a></p>
  </body>
</html>
